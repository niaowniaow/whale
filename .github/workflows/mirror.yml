name: Mirror to GitLab

on:
  push:
    branches: ["*"]
    tags: ["*"]
  delete:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync to GitLab
        run: |
          git remote add mirror "https://oauth2:${GITLAB_TOKEN}@gitlab.com/niaowniaow/whale.git"

          if [ "${{ github.event_name }}" = "delete" ]; then
            git push mirror --delete "${{ github.event.ref }}" || true
          else
            git push mirror --all --force
            git push mirror --tags --force
          fi
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_MIRROR_TOKEN }}
