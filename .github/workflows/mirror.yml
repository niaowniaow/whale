name: Mirror to GitLab

on:
  push:
    branches: ["*"]
    tags: ["*"]
  delete:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to GitLab
        run: |
          git remote add mirror "https://oauth2:${GITLAB_TOKEN}@https://gitlab.com/niaowniaow/whale.git"
          git push --mirror mirror
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_MIRROR_TOKEN }}   
